<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYSTEM.ROOT | Naveen Kumar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'cyber-green': '#00ff41',
              'cyber-cyan': '#00f3ff',
              'cyber-red': '#ff003c',
              'cyber-black': '#020202',
              'cyber-gray': '#111111',
              'terminal-dim': 'rgba(0, 255, 65, 0.1)',
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'glitch': 'glitch 1s linear infinite',
              'scan': 'scan 4s linear infinite',
              'blink': 'blink 1s step-end infinite',
              'type': 'type 3s steps(40, end)',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              scan: {
                '0%': { backgroundPosition: '0 -100vh' },
                '100%': { backgroundPosition: '0 100vh' }
              },
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #00ff41;
        --secondary: #00f3ff;
        --bg: #050505;
      }
      
      body {
        background-color: var(--bg);
        color: #e0e0e0;
        font-family: 'JetBrains Mono', monospace;
        overflow-x: hidden;
        cursor: none;
      }

      /* CRT Scanline Effect */
      .crt::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .crt::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: rgba(18, 16, 16, 0.02);
        opacity: 0;
        z-index: 50;
        pointer-events: none;
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.01; }
        50% { opacity: 0.03; }
        100% { opacity: 0.01; }
      }

      /* Selection */
      ::selection {
        background: var(--primary);
        color: #000;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
        border-left: 1px solid #222;
      }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border: 1px solid var(--primary);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
      }
      
      /* Cursor */
      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background: var(--primary);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
      }
      .cursor-crosshair {
        position: fixed;
        top: 0;
        left: 0;
        width: 40px;
        height: 40px;
        border: 1px solid transparent;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cursor-crosshair::before, .cursor-crosshair::after {
        content: '';
        position: absolute;
        background: var(--primary);
      }
      .cursor-crosshair::before { width: 100%; height: 1px; }
      .cursor-crosshair::after { width: 1px; height: 100%; }

      /* Debug/Skeleton Mode */
      body.skeleton-active {
        background: #000 !important;
      }
      body.skeleton-active * {
        border: 1px solid rgba(0, 255, 65, 0.3) !important;
        background: transparent !important;
        color: rgba(0, 255, 65, 0.8) !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        animation: none !important;
        backdrop-filter: none !important;
        text-shadow: none !important;
      }
      body.skeleton-active img, 
      body.skeleton-active .crt::before {
        display: none !important;
      }
      body.skeleton-active .skeleton-hide {
        display: none !important;
      }
      
      /* Utility Classes for Terminal Look */
      .terminal-card {
        background: rgba(5, 5, 5, 0.9);
        border: 1px solid #222;
        position: relative;
      }
      .terminal-card:hover {
        border-color: var(--primary);
        box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
      }
      .corner-brackets {
        position: relative;
      }
      .corner-brackets::before, .corner-brackets::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1px solid var(--primary);
        transition: all 0.3s ease;
      }
      .corner-brackets::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .corner-brackets::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      .terminal-card:hover .corner-brackets::before,
      .terminal-card:hover .corner-brackets::after {
        width: 100%;
        height: 100%;
      }

    </style>
