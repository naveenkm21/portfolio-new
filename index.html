<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naveen Kumar | Full Stack Innovator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
            },
            colors: {
              'neon-blue': '#00f3ff',
              'neon-purple': '#bc13fe',
              'deep-space': '#050510',
              'glass-border': 'rgba(255, 255, 255, 0.08)',
              'glass-bg': 'rgba(255, 255, 255, 0.03)',
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'pulse-fast': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glitch': 'glitch 1s linear infinite',
              'shimmer': 'skeleton-shimmer 3s infinite linear',
              'scan': 'scan-line 2.5s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              'skeleton-shimmer': {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              },
              'scan-line': {
                '0%': { top: '-10%' },
                '100%': { top: '110%' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050510;
        color: #ffffff;
        overflow-x: hidden;
        cursor: none; /* Custom cursor control */
        transition: background-color 0.5s ease;
      }
      
      /* Smooth transitions for elements entering/exiting skeleton mode */
      h1, h2, h3, h4, h5, h6, p, span, a, li, button, .glass-card, nav {
        transition: color 0.5s ease, background-color 0.5s ease, border-color 0.5s ease, backdrop-filter 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease;
      }
      
      /* Custom Cursor Styles */
      .cursor-dot,
      .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
      }
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: #00f3ff;
      }
      .cursor-outline {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(0, 243, 255, 0.5);
        transition: width 0.2s, height 0.2s, background-color 0.2s;
      }
      body:hover .cursor-outline {
        background-color: rgba(0, 243, 255, 0.05);
      }

      /* Noise Texture */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050510;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      
      .text-gradient {
        background: linear-gradient(to right, #00f3ff, #bc13fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .text-stroke {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
        color: transparent;
      }

      /* --- SKELETON MODE STYLES --- */
      body.skeleton-active .bg-noise,
      body.skeleton-active .cursor-dot,
      body.skeleton-active .cursor-outline,
      body.skeleton-active .skeleton-ignore {
        visibility: visible;
      }

      /* Hide images and specific decorations */
      body.skeleton-active img,
      body.skeleton-active svg:not(.skeleton-ignore) {
        opacity: 0 !important;
        transition: opacity 0.5s ease;
      }

      /* Transform text content into shimmering bars */
      body.skeleton-active h1,
      body.skeleton-active h2,
      body.skeleton-active h3,
      body.skeleton-active h4,
      body.skeleton-active h5,
      body.skeleton-active h6,
      body.skeleton-active p,
      body.skeleton-active span,
      body.skeleton-active a,
      body.skeleton-active li,
      body.skeleton-active button:not(.skeleton-ignore) {
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05) 25%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0.05) 75%
        ) !important;
        background-size: 200% 100% !important;
        animation: skeleton-shimmer 3s infinite linear !important;
        border-radius: 4px !important;
        box-shadow: none !important;
        text-shadow: none !important;
        border: none !important;
        pointer-events: none !important;
        user-select: none !important;
      }
      
      /* Wireframe effect for containers */
      body.skeleton-active .glass-card {
        background: rgba(0, 243, 255, 0.02) !important;
        border: 1px solid rgba(0, 243, 255, 0.2) !important;
        backdrop-filter: none !important;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.05) !important;
      }

      body.skeleton-active nav {
        background: #050510 !important;
        border-bottom: 1px solid rgba(0, 243, 255, 0.2) !important;
      }
      
      body.skeleton-active .text-stroke {
        -webkit-text-stroke: 0px !important;
      }

      /* Ensure layout doesn't collapse */
      body.skeleton-active *:empty {
         min-height: 1em;
         min-width: 20px;
         display: inline-block;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
